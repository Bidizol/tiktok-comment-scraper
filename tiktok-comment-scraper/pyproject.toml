[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-scraper"
version = "0.1.0"
description = "Production-oriented TikTok comment scraper"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tiktok-scraper = "tiktok_scraper.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
