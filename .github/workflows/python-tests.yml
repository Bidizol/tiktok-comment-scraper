name: Python tests

on:
  push:
    branches:
      - repo-sanity-cleanup
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-comment-scraper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest -q
