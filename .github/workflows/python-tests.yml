name: Python tests

# Deliberately manual only. Automated validation is deferred until Phase 10
# is implemented and the user explicitly authorizes the complete test pass.
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-comment-scraper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest -q
